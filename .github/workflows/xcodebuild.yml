name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TMDB_API_KEY: ''

jobs:
  packages:
    name: Strict lint and retained package coverage gates
    runs-on: macos-26-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Show existing toolchain and reject local credential configuration
        run: |
          xcodebuild -version
          swiftlint version
          test ! -e DeveloperSettings.xcconfig
      - name: Run the retained strict lint entrypoint
        run: ./scripts/lint.sh
      - name: Run all retained package tests and unchanged coverage gates
        env:
          COVERAGE_REPORT_DIR: ${{ runner.temp }}/package-coverage
        run: |
          set -euo pipefail
          ./scripts/ci/check_coverage.sh 2>&1 | tee "$RUNNER_TEMP/package-coverage.log"
      - name: Verify tracked source was preserved
        run: git diff --quiet --exit-code
      - name: Retain failure diagnostics only
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: package-failure-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/package-coverage.log
            ${{ runner.temp }}/package-coverage
          retention-days: 3

  apps:
    name: ${{ matrix.family }} full app tests
    needs: packages
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: iPhone
            platform: ios
            scheme: MovieSwift
          - family: iPad
            platform: ios
            scheme: MovieSwift
          - family: Apple TV
            platform: tvos
            scheme: MovieSwiftTV
          - family: macOS
            platform: macos
            scheme: MovieSwiftMac
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Show toolchain and reject local credentials
        run: |
          xcodebuild -version
          test ! -e DeveloperSettings.xcconfig
      - name: Select an installed compatible simulator
        if: matrix.platform != 'macos'
        id: simulator
        run: python3 -I scripts/ci/select_simulator.py '${{ matrix.family }}'
      - name: Run every iPhone or iPad test with retained app coverage gate
        if: matrix.platform == 'ios'
        env:
          IOS_SIMULATOR_FAMILY: ${{ matrix.family }}
          IOS_SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          IOS_TEST_ITERATIONS: '1'
          XCODE_DERIVED_DATA_PATH: ${{ runner.temp }}/DerivedData
          XCODE_TEST_RESULT_BUNDLE_PATH: ${{ runner.temp }}/app.xcresult
          COVERAGE_REPORT_DIR: ${{ runner.temp }}/app-coverage
        run: |
          set -euo pipefail
          ./scripts/ci/run_ios_tests.sh 2>&1 | tee "$RUNNER_TEMP/app-tests.log"
      - name: Run every macOS or tvOS unit and UI test
        if: matrix.platform != 'ios'
        run: |
          set -euo pipefail
          destination='id=${{ steps.simulator.outputs.udid }}'
          signing=(CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=)
          if [[ '${{ matrix.platform }}' == macos ]]; then
            destination='platform=macOS'
            signing=(CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES)
          fi
          xcodebuild -project MovieSwift/MovieSwift.xcodeproj -scheme '${{ matrix.scheme }}' \
            -destination "$destination" -parallel-testing-enabled NO -jobs 2 \
            -testLanguage en -testRegion US -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/app.xcresult" "${signing[@]}" TMDB_API_KEY= \
            test 2>&1 | tee "$RUNNER_TEMP/app-tests.log"
      - name: Build unsigned Release for each application scheme
        if: matrix.family != 'iPad'
        run: |
          set -euo pipefail
          case '${{ matrix.platform }}' in
            ios) destination='generic/platform=iOS Simulator' ;;
            tvos) destination='generic/platform=tvOS Simulator' ;;
            macos) destination='platform=macOS' ;;
          esac
          xcodebuild -project MovieSwift/MovieSwift.xcodeproj -scheme '${{ matrix.scheme }}' \
            -configuration Release -destination "$destination" -jobs 2 \
            -derivedDataPath "$RUNNER_TEMP/Release" CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= TMDB_API_KEY= \
            build 2>&1 | tee "$RUNNER_TEMP/app-release.log"
      - name: Verify tracked source was preserved
        run: git diff --quiet --exit-code
      - name: Retain failure diagnostics only
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-failure-${{ matrix.family }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/app-tests.log
            ${{ runner.temp }}/app-release.log
            ${{ runner.temp }}/app.xcresult
            ${{ runner.temp }}/app-coverage
          retention-days: 3
